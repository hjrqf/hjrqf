<!-- layouts/shortcodes/bilibili.html -->
<div class="bilibili_shortcodes">
  <iframe
    src="https://player.bilibili.com/player.html?bvid={{ .Get 0 }}&page={{ if .Get 1 }}{{ .Get 1 }}{{ else }}1{{ end }}&high_quality=1&danmaku=0&autoplay=0&as_wide=0"
    scrolling="no" 
    frameborder="0" 
    allowfullscreen="true">
  </iframe>
</div>

<style>
  .bilibili_shortcodes {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 66%; /* 控制宽高比例 */
    margin: auto;
    overflow: hidden;
    text-align: center;
  }

  .bilibili_shortcodes iframe {
    position: absolute;
    width: 80%;
    height: 80%;
    left: 0;
    top: 0;
  }
</style>
